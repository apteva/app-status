<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Status</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.4 system-ui, -apple-system, sans-serif;
    color: #e5e7eb;
    background: transparent;
    padding: 12px;
  }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .emoji { font-size: 18px; }
  .msg { flex: 1; min-width: 0; }
  .tone { font-size: 10px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tone-info     { background: rgba(99,102,241,0.15); color: #a5b4fc; }
  .tone-working  { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .tone-warn     { background: rgba(245,158,11,0.20); color: #fbbf24; }
  .tone-error    { background: rgba(239,68,68,0.18);  color: #fca5a5; }
  .tone-success  { background: rgba(16,185,129,0.18); color: #6ee7b7; }
  .tone-idle     { background: rgba(120,120,140,0.18); color: #a1a1aa; }
  .meta { font-size: 11px; color: #94a3b8; }
  .empty { color: #94a3b8; font-style: italic; padding: 8px 0; }
</style>
</head>
<body>
<div id="root"><div class="empty">Loading…</div></div>
<script>
(function () {
  // Read context the parent dashboard injects via query string.
  const params = new URLSearchParams(location.search);
  const installId = params.get('install_id') || '';
  const instanceId = params.get('instance_id') || '';
  const token = params.get('token') || '';

  // Hit the proxied app endpoint at /apps/<name>/<route>.
  // Inside the iframe we're already on the dashboard origin, so a
  // relative URL works.
  const url = '/api/apps/status/instances/' + encodeURIComponent(instanceId);

  function render(data) {
    const root = document.getElementById('root');
    if (!data || !data.message) {
      root.innerHTML = '<div class="empty">No status set yet.</div>';
      return;
    }
    const tone = (data.tone || 'info').toLowerCase();
    const safe = (s) => String(s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
    root.innerHTML =
      '<div class="row">' +
        (data.emoji ? '<span class="emoji">' + safe(data.emoji) + '</span>' : '') +
        '<span class="msg">' + safe(data.message) + '</span>' +
        '<span class="tone tone-' + safe(tone) + '">' + safe(tone) + '</span>' +
      '</div>' +
      '<div class="meta">' +
        (data.set_by_thread ? safe(data.set_by_thread) + ' · ' : '') +
        new Date(data.updated_at || Date.now()).toLocaleTimeString() +
      '</div>';
  }

  function load() {
    fetch(url, { headers: token ? { Authorization: 'Bearer ' + token } : {} })
      .then(r => r.status === 204 ? null : r.json())
      .then(render)
      .catch(() => {
        document.getElementById('root').innerHTML = '<div class="empty">Couldn\'t load status.</div>';
      });
  }

  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
